name: Fix code style issues

on:
  pull_request:
    branches: [master, develop]
    paths:
      - "**.php"
      - "**.js"
      - "**.ts"
      - "**.vue"

jobs:
  code-styling:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Fix PHP code style issues
        uses: aglipanci/laravel-pint-action@2.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Fix JavaScript/TypeScript/Vue code style
        run: |
          # ESLint con auto-fix (continua anche con warnings)
          npx eslint . --ext .js,.ts,.vue --fix --max-warnings 10 || echo "ESLint completed with warnings"
          
          # Prettier formatting
          npx prettier --write "**/*.{js,ts,vue,json,css,scss,md}"
          
          # Check finale per errori gravi (escludo warnings)
          npx eslint . --ext .js,.ts,.vue --quiet || echo "Found some linting issues but continuing..."

      - name: Show remaining linting issues
        run: |
          echo "=== Remaining linting issues (for manual review) ==="
          npx eslint . --ext .js,.ts,.vue --format=compact || true
        continue-on-error: true

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: 🎨 fix code style issues"
