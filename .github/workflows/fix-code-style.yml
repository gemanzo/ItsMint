name: Fix code style issues

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "**.php"
      - "**.js"
      - "**.ts"
      - "**.vue"

jobs:
  code-styling:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}

      - name: Fix PHP code style issues
        uses: aglipanci/laravel-pint-action@2.4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Fix JavaScript/TypeScript/Vue code style
        run: |
          npx eslint . --ext .js,.ts,.vue --fix || true
          npx prettier --write "**/*.{js,ts,vue,json,css,scss,md}" || true

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "style: 🎨 fix code style issues"
