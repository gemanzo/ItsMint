name: CD - Continuous Deployment

# Deploys only master commits that passed the CI workflow (ci.yml):
# a push on master no longer goes to production without tests and build checks.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

# Never run two deploys at the same time; a new one waits for the running one
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    # Only when CI succeeded for a push (not for a pull request targeting master)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          port: ${{ secrets.PROD_PORT }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd /var/www/html/ItsMint
            git pull origin master
            chmod +x scripts/deploy.sh
            bash scripts/deploy.sh
