[program:horizon]
command=/usr/local/bin/php /var/www/html/itsmint/artisan horizon
process_name=%(program_name)s
directory=/var/www/html/itsmint
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/itsmint/storage/logs/horizon.log
stopwaitsecs=3600 