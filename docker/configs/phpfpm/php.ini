[Date]
; Defines the default timezone used by the date functions
; http://php.net/date.timezone
date.timezone = Europe/Rome
memory_limit = 2048M
max_execution_time = 3000
post_max_size= 50M
upload_max_filesize = 25M

; Session upload progress is not used by the application. Disabled as recommended by
; php.net to mitigate CVE-2026-109619 and CVE-2026-115560 (not patched yet).
; It must be set here (or in the FPM pool): ini_set() at runtime is too late.
session.upload_progress.enabled = 0
