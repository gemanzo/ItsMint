version: '3.8'

services:
  # Production services for Let's Encrypt
  nginx-proxy:
    image: nginxproxy/nginx-proxy
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - proxy

  letsencrypt:
    image: nginxproxy/acme-companion
    container_name: nginx-letsencrypt
    restart: always
    depends_on:
      - nginx-proxy
    environment:
      - DEFAULT_EMAIL=${LETSENCRYPT_EMAIL:-admin@example.com}
    volumes:
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/var/run/docker.sock:ro
    volumes_from:
      - nginx-proxy
    networks:
      - proxy

  # Development services
  nginx:
    image: nginx:alpine
    container_name: "nginx_${APP_NAME}"
    restart: always
    volumes:
      - ".:/var/www/html/${DOCKER_PROJECT_DIR_NAME}"
      - "./docker/configs/nginx/nginx.conf:/etc/nginx/conf.d/default.conf"
    depends_on:
      - php
      - node
    # Production environment variables
    environment:
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    networks:
      - proxy
  node:
    build: 
      context: .
      dockerfile: ./docker/configs/node/Dockerfile
    container_name: "node_${APP_NAME}"
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ".:/var/www/html/${DOCKER_PROJECT_DIR_NAME}"
      - "/var/www/html/${DOCKER_PROJECT_DIR_NAME}/node_modules"
    working_dir: "/var/www/html/${DOCKER_PROJECT_DIR_NAME}"
    command: sleep infinity
    environment:
      - NODE_ENV=development
    networks:
      - proxy
  php:
    extra_hosts:
      - host.docker.internal:host-gateway
    # user: root
    build:
      context: .
      dockerfile: ./docker/configs/phpfpm/Dockerfile
    restart: always
    container_name: "php_${APP_NAME}"
    image: wm-phpfpm:8.4
    ports:
      - ${DOCKER_PHP_PORT}:9000
    volumes:
      - ".:/var/www/html/${DOCKER_PROJECT_DIR_NAME}"
      - "../wm-package:/var/www/html/wm-package"
    working_dir: "/var/www/html/${DOCKER_PROJECT_DIR_NAME}"
    networks:
      - proxy
  db:
    image: postgres:17-alpine
    container_name: "postgres_${APP_NAME}"
    restart: always
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?err}
      POSTGRES_USER_PASSWORD: ${DB_PASSWORD:?err}
      POSTGRES_USER: ${DB_USERNAME:?err}
      POSTGRES_DB: ${DB_DATABASE:?err}
    volumes:
      - "./docker/volumes/postgresql/data:/var/lib/postgresql/data"
    ports:
      - ${DOCKER_PSQL_PORT}:5432
    networks:
      - proxy
  redis:
    image: redis:latest
    container_name: "redis_${APP_NAME}"
    restart: always
    networks:
      - proxy
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.1
    container_name: "elasticsearch_${APP_NAME}"
    restart: always
    environment:
      - node.name=elasticsearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - proxy

networks:
  proxy:
    driver: bridge

volumes:
  certs:
  vhost:
  html:
