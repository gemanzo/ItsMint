version: '3.8'

services:
  node:
    build: 
      context: .
      dockerfile: ./docker/configs/node/Dockerfile
    container_name: "node_${APP_NAME}"
    restart: always
    # Published ports are bound to 127.0.0.1: Docker bypasses host firewalls (ufw),
    # so a plain "port:port" mapping is reachable from the whole internet.
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ".:/var/www/html/${DOCKER_PROJECT_DIR_NAME}"
      - "/var/www/html/${DOCKER_PROJECT_DIR_NAME}/node_modules"
    working_dir: "/var/www/html/${DOCKER_PROJECT_DIR_NAME}"
    command: sleep infinity
    environment:
      - NODE_ENV=development
    networks:
      - itsmint_network
  php:
    extra_hosts:
      - host.docker.internal:host-gateway
    build:
      context: .
      dockerfile: ./docker/configs/phpfpm/Dockerfile
    restart: always
    container_name: "php_${APP_NAME}"
    image: wm-phpfpm:8.4
    # An exposed FastCGI port allows remote code execution: localhost only
    # (the host nginx connects to 127.0.0.1:${DOCKER_PHP_PORT})
    ports:
      - "127.0.0.1:${DOCKER_PHP_PORT:-9000}:9000"
    volumes:
      - ".:/var/www/html/${DOCKER_PROJECT_DIR_NAME}"
      - "../wm-package:/var/www/html/wm-package"
    working_dir: "/var/www/html/${DOCKER_PROJECT_DIR_NAME}"
    networks:
      - itsmint_network
      
  db:
    image: postgres:17-alpine
    container_name: "postgres_${APP_NAME}"
    restart: always
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?err}
      POSTGRES_USER_PASSWORD: ${DB_PASSWORD:?err}
      POSTGRES_USER: ${DB_USERNAME:?err}
      POSTGRES_DB: ${DB_DATABASE:?err}
    volumes:
      - "./docker/volumes/postgresql/data:/var/lib/postgresql/data"
    # Database reachable only from the host (use an SSH tunnel for remote access)
    ports:
      - "127.0.0.1:${DOCKER_PSQL_PORT:-5432}:5432"
    networks:
      - itsmint_network
      
  redis:
    image: redis:latest
    container_name: "redis_${APP_NAME}"
    restart: always
    networks:
      - itsmint_network
      
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.1
    container_name: "elasticsearch_${APP_NAME}"
    restart: always
    environment:
      - node.name=elasticsearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - itsmint_network

networks:
  itsmint_network:
    driver: bridge
